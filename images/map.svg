<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوگوی شهرک رهایشی حاجی فضل احمد عمر</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f9;
    }
    /* تنظیم ابعاد لوگو در قالب */
    .logo-container {
      width: 100%;
      max-width: 380px; /* اندازه دلخواه لوگو */
      aspect-ratio: 1 / 1;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <!-- کد <svg> بالا را مستقیماً در این قسمت قرار دهید -->
    <!-- یا اگر آن را با نام logo.svg ذخیره کرده‌اید، به شکل زیر فراخوانی کنید: -->
    <!-- <img src="logo.svg" alt="شهرک رهایشی حاجی فضل احمد عمر" width="100%"> -->
  </div>

</body>
</html>
